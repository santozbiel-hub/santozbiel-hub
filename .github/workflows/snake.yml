name: Atualizar animação de contribuições
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml', 'scripts/profile_stats.py']
permissions:
  contents: write
concurrency:
  group: profile-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar estatísticas públicas
        run: python3 scripts/profile_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#38bdf8&color_dots=#161b22,#172554,#1e3a8a,#1d4ed8,#60a5fa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar animação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar animação de contribuições"
            git push
          fi
