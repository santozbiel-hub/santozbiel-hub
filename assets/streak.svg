<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="185" viewBox="0 0 1000 185"><rect width="1000" height="185" rx="12" fill="#11151e"/><text x="25" y="37" font-family="Arial,sans-serif" font-size="24" fill="#38bdf8">Consistência</text><text x="25" y="91" font-family="Arial,sans-serif" font-size="38" fill="#7dd3fc">2</text><text x="25" y="125" font-family="Arial,sans-serif" font-size="15" fill="#c9d1d9">dias na sequência atual</text><text x="365" y="91" font-family="Arial,sans-serif" font-size="38" fill="#7dd3fc">2</text><text x="365" y="125" font-family="Arial,sans-serif" font-size="15" fill="#c9d1d9">melhor sequência (12 meses)</text><text x="705" y="91" font-family="Arial,sans-serif" font-size="38" fill="#7dd3fc">6</text><text x="705" y="125" font-family="Arial,sans-serif" font-size="15" fill="#c9d1d9">dias ativos (12 meses)</text><text x="25" y="162" font-family="Arial,sans-serif" font-size="12" fill="#8b949e">Sequência atual considera hoje ou ontem como último dia ativo.</text></svg>